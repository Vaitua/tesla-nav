<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tesla Nav</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div id="fade"></div>
<div id="tint"></div>

<div id="banner" hidden>
  <div id="manIcon">↑</div>
  <div>
    <div id="manDist">—</div>
    <div id="manText"></div>
  </div>
</div>

<div id="search">
  <input id="q" type="search" placeholder="Où allez-vous ?" autocomplete="off">
  <div id="favs"></div>
  <ul id="results"></ul>
</div>

<div id="pick" hidden>
  <span>Point choisi sur la carte</span>
  <button id="go">Y aller</button>
  <button id="cancelPick" class="ghost">✕</button>
</div>

<div id="panel" hidden>
  <div class="row"><span>🛰️ Vue satellite</span><button class="sw" id="swSat" role="switch" aria-checked="false"></button></div>
  <div class="row"><span>⚡ Bornes de recharge</span><button class="sw" id="swCh" role="switch" aria-checked="true"></button></div>
  <div class="legend">
    <span><i style="background:#e31937"></i>Tesla</span><span><i style="background:#8b5cf6"></i>≥150 kW</span>
    <span><i style="background:#10b981"></i>50–149</span><span><i style="background:#3b82f6"></i>22–49</span><span><i style="background:#94a3b8"></i>&lt;22</span>
  </div>
  <div class="row"><span>🎙️ Voix HD réaliste<small id="hdStatus">Neuronale, hors ligne après 1er chargement</small></span><button class="sw" id="swHd" role="switch" aria-checked="false"></button></div>
  <div class="row"><span>🔊 Voix système<small id="voiceName">—</small></span><span class="btns"><button id="voiceNext" class="mini">Changer</button><button id="voiceTest" class="mini">Écouter</button></span></div>
</div>

<div id="station" hidden>
  <div class="stInfo"><b id="stName">—</b><small id="stDetail"></small></div>
  <button id="stGo">Y aller</button>
  <button id="stClose" class="ghost">✕</button>
</div>

<div id="trip" hidden>
  <div><b id="eta">--:--</b><small>arrivée</small></div>
  <div><b id="remTime">--</b><small>restant</small></div>
  <div><b id="remDist">--</b><small>distance</small></div>
  <button id="stop" title="Arrêter la navigation">✕</button>
</div>

<!-- Bloc en bas à gauche : jauges (vitesse, limite, météo) au-dessus, barre d'outils horizontale en dessous -->
<div id="hud">
  <div id="gauges">
    <div id="speedBox"><b id="spd">0</b><span>km/h</span></div>
    <div id="limit" hidden title="Limitation de vitesse"><span id="limitNum"></span></div>
    <div id="weather" hidden title="Météo en direct"><span id="wIcon">☀️</span><b id="wTemp">--°</b></div>
  </div>
  <div id="toolbar" class="collapsed">
    <button id="menuBtn" title="Menu">☰</button>
    <div id="tools">
      <button id="zoomOut" title="Zoom −">−</button>
      <button id="zoomIn" title="Zoom +">+</button>
      <button id="autoZoom" title="Zoom auto aux intersections">A</button>
      <i class="sep"></i>
      <button id="satBtn" title="Vue satellite">🛰️</button>
      <i class="sep"></i>
      <button id="mute" title="Couper la voix">🔊</button>
      <button id="layersBtn" title="Calques, bornes et voix">🗺️</button>
    </div>
  </div>
</div>

<div id="status"></div>
<canvas id="wx"></canvas>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
